<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collective Image Lab</title>
<style>
:root{
  --ink:#171442; --ink2:#4A4A6A; --dim:#8A8AA3;
  --line:#E6E4F0; --line2:#D2CFE4;
  --bg:#FFFFFF; --panel:#FBFAFE; --canvas:#FDFCFE;
  /* Colour carries state, not decoration:
     violet = your own work and the Run action
     magenta = gradient partner only, never used alone
     azure  = anything belonging to a shared collection
     amber  = locked collection states                        */
  --violet:#7B2FF7; --magenta:#E5147F; --azure:#1B9CD8; --amber:#F0A020;
  --azure-bg:#F0F8FC; --azure-line:#BDE0F1;
  --amber-bg:#FFF9EF; --amber-line:#F6E0BE; --amber-ink:#7A5313;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --rail:312px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}


header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line);z-index:30}
.brand{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--violet);font-weight:600}
.views{margin-left:auto;display:flex;gap:6px}


aside{position:fixed;top:56px;left:0;bottom:0;width:var(--rail);overflow-y:auto;background:var(--panel);
  border-right:1px solid var(--line);z-index:20;padding:20px 18px 32px}
.step{margin-bottom:26px}
.step h2{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px}
.num{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--violet)}
.num.az{background:var(--azure)}
.step p{margin:0 0 10px;color:var(--ink2);font-size:12.5px}
.step.off{opacity:.4;pointer-events:none}
.hint{font-size:11.5px;color:var(--dim);line-height:1.6}


button,.btn{background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:8px;
  padding:7px 12px;cursor:pointer;font:inherit;font-size:12.5px;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ink2)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.views button.on{background:var(--ink);border-color:var(--ink);color:#fff}
button[data-mode]{flex:0 0 calc(50% - 3px);min-width:0;text-align:center;padding:8px 6px}
button[data-mode].on{background:var(--violet);border-color:var(--violet);color:#fff}
.go{width:100%;padding:11px;font-size:13px;font-weight:600;color:#fff;border:0;
  background:linear-gradient(90deg,var(--violet),var(--magenta));
  box-shadow:0 4px 14px rgba(123,47,247,.22);transition:.16s}
.go:hover{box-shadow:0 7px 20px rgba(123,47,247,.3)}
.go:disabled{background:#fff;color:var(--dim);border:1px solid var(--line);box-shadow:none}
.row{display:flex;gap:6px;flex-wrap:wrap}
a{color:var(--violet)}


.zone{border:1.5px dashed var(--line2);border-radius:10px;padding:20px 14px;text-align:center;
  color:var(--dim);font-size:12.5px;cursor:pointer;background:#fff;transition:.15s}
.zone:hover{border-color:var(--violet);color:var(--ink2)}
.zone.over{border-color:var(--magenta);background:#FEF3F8;color:var(--ink)}
.zone b{display:block;color:var(--ink);font-size:13px;font-weight:600;margin-bottom:3px}
.picker-row{margin-top:8px}
.picker-row button{flex:1;min-width:120px}
progress{width:100%;height:7px;margin:10px 0 2px;accent-color:var(--violet)}
.file-report{margin-top:9px;border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:8px 10px;color:var(--ink2);font-size:11.5px}
.file-report summary{cursor:pointer;color:var(--ink);font-weight:600}
.file-report ul{margin:7px 0 0;padding-left:18px;max-height:110px;overflow:auto}


.tally{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin:10px 0}
.tally i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.dot.own{background:var(--violet)} .dot.shared{background:var(--azure)}


#collections{display:flex;flex-direction:column;gap:7px}
#collSearch{margin:0 0 8px}
#collMore{width:100%;margin-top:8px}
#clearCollections{width:100%;margin-top:10px}
.coll{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;
  cursor:pointer;transition:.15s;display:flex;align-items:center;gap:9px}
.coll:hover{border-color:var(--azure)}
.coll.on{border-color:var(--azure);background:var(--azure-bg)}
.coll.loaded{cursor:default}
.coll .t{flex:1;min-width:0}
.coll .t b{display:block;font-size:12.5px;font-weight:600}
.coll .t span{color:var(--dim);font-size:11px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  border-radius:4px;padding:2px 6px;flex:none}
.tag.lock{color:var(--amber-ink);border:1px solid var(--amber-line);background:var(--amber-bg)}
.tag.in{color:var(--azure);border:1px solid var(--azure-line);background:var(--azure-bg)}


.notice{border:1px solid var(--amber-line);background:var(--amber-bg);border-radius:10px;
  padding:11px 13px;font-size:12px;color:var(--amber-ink);line-height:1.55}
.notice b{color:#5C3D0A}
.notice.az{border-color:var(--azure-line);background:var(--azure-bg);color:#155F82}
.notice.az b{color:#0E4762}


select,input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;
  font:inherit;font-size:12.5px;background:#fff;color:var(--ink)}


main{position:fixed;top:56px;left:var(--rail);right:0;bottom:0;background:var(--canvas)}
/* Explicit width/height are required: canvas is a replaced element, so with
   inset:0 and width:auto its layout size would come from the width attribute,
   and resize() writing that attribute would feed back into itself. */
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;
  cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);text-align:center;padding:40px;font-size:13.5px}
#empty.hide{display:none}
#status{position:absolute;left:20px;bottom:20px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:8px 13px;color:var(--ink2);font-size:12.5px}
#status.hide{display:none}
#legend{position:absolute;right:20px;bottom:20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right}


#detail{position:fixed;inset:0;z-index:40;background:rgba(23,20,66,.93);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:34px;cursor:zoom-out}
#detail.show{display:flex}
#detail img{max-width:86vw;max-height:74vh;border-radius:6px}
#detail .meta{color:#CFCCE4;font-size:12px;font-family:var(--mono);letter-spacing:.06em}
.credit{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--dim);
  line-height:1.7;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.credit .institution{white-space:nowrap}


/*
  ============================================================
  COLLECTIVE IMAGE LAB â€” welcome screen (logo only)
  ============================================================

  LOCKED â€” do not change:
  1. The background image. Do not swap, regenerate, recolour, crop
     or tint it.
  2. The crop-mark lockup is the ONLY branding. No second wordmark.
  3. No description, tagline, hint text or credit block here.

  THE MOTION â€” four layers, deliberately separate:
  A. Ambient flow: feTurbulence displaces the whole image.
  B. Slow drift: both image copies pan together on a 46s cycle.
  C. Local response: a harder-warped second copy is revealed only
     through a soft radial mask at the cursor.
  D. Lean: the wrapper eases away from the cursor independently of
     the image drift transforms.

  NOTES FOR ANY LATER EDIT:
  - Displacement scales are driven from JavaScript. Do NOT add a
    SMIL <animate> to flowDisp or rippleDisp; it would overwrite the
    values set each frame.
  - Both image layers carry the same slowdrift animation so they stay
    registered. If one changes, change both.
  ============================================================
*/

:root {
  --mx: 50%;
  --my: 50%;
  --mr: 0px;
}

#landing {
  position: fixed;
  inset: 0;
  z-index: 60;
  overflow: hidden;
  cursor: pointer;
  background: #e9f1f7;
  transition: opacity 420ms ease;
}

#marbleWrap {
    position: fixed;
    inset: -6%;
    width: 112%;
    height: 112%;
    will-change: transform;
  }

  #marbleWrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    will-change: transform, filter;
    animation: slowdrift 46s ease-in-out infinite;
  }

  /* layer A+B â€” the ambient flow, across the whole surface */
  #marble { filter: url(#flowWaves); }

  /* layer C â€” warped harder, shown only through the moving mask */
  #marbleRipple {
    filter: url(#rippleWaves);
    opacity: 0;
    -webkit-mask-image: radial-gradient(circle var(--mr) at var(--mx) var(--my),
      rgba(0,0,0,1) 0%, rgba(0,0,0,0.72) 38%, rgba(0,0,0,0.28) 68%, rgba(0,0,0,0) 100%);
    mask-image: radial-gradient(circle var(--mr) at var(--mx) var(--my),
      rgba(0,0,0,1) 0%, rgba(0,0,0,0.72) 38%, rgba(0,0,0,0.28) 68%, rgba(0,0,0,0) 100%);
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  @keyframes slowdrift {
    0%   { transform: scale(1.06) translate(0%, 0%); }
    50%  { transform: scale(1.06) translate(-1.5%, 1%); }
    100% { transform: scale(1.06) translate(0%, 0%); }
  }

  @media (prefers-reduced-motion: reduce) {
    #marbleWrap img { animation: none; }
    #marbleRipple { display: none; }
  }

  .screen {
    position: relative;
    z-index: 1;
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    transition: opacity 420ms ease;
  }

  #landing.leaving { opacity: 0; pointer-events: none; }

  .screen.leaving { opacity: 0; }

  .enter {
    appearance: none;
    background: none;
    border: 0;
    padding: 0.75rem;
    margin: 0;
    cursor: pointer;
    border-radius: 4px;
    display: block;
  }

  .enter:focus-visible {
    outline: 2px solid var(--violet);
    outline-offset: 6px;
  }

  .lockup {
    display: block;
    width: min(420px, 76vw);
    height: auto;
    transition: transform 260ms ease;
  }

  body.live .lockup { transform: scale(1.02); }

  @media (prefers-reduced-motion: reduce) {
    .screen, .lockup { transition: none; }
    body.live .lockup { transform: none; }
  }
</style>
</head>
<body>


<div id="landing">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <!-- ambient field -->
    <filter id="flowWaves" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2"
                    seed="4" result="noise">
        <animate id="animFreq" attributeName="baseFrequency"
                 values="0.006 0.009;0.008 0.007;0.006 0.011;0.006 0.009"
                 dur="38s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap id="flowDisp" in="SourceGraphic" in2="noise" scale="28"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- local field: same seed so it stays in register with the ambient
         layer, but pushed much harder; only ever visible through the mask -->
    <filter id="rippleWaves" x="-16%" y="-16%" width="132%" height="132%">
      <feTurbulence type="fractalNoise" baseFrequency="0.007 0.010" numOctaves="2"
                    seed="4" result="rnoise">
        <animate attributeName="baseFrequency"
                 values="0.007 0.010;0.009 0.008;0.007 0.012;0.007 0.010"
                 dur="26s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap id="rippleDisp" in="SourceGraphic" in2="rnoise" scale="70"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs></svg>
